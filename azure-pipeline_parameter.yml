trigger:
- master

pool:
  name: Default   # Your agent pool name

variables:
- group: New variable group 08-Sep

parameters:
- name: requestId
  type: string
  default: REQ0012345

- name: env
  type: string
  default: prod

- name: templateName
  type: string
  default: launch_vm

- name: callbackUrl
  type: string
  default: ""

steps:
- script: |
    echo "=== Step 1: Setup Python & Ansible dependencies ==="
    export LANG=C.UTF-8
    export LC_ALL=C.UTF-8
    python3 --version

    python3 -m venv venv
    source venv/bin/activate
    pip install --upgrade pip
    pip install ansible requests msrestazure azure-cli
    ansible-galaxy collection install azure.azcollection
  displayName: Setup Python & Install Ansible + Azure dependencies

- script: |
    echo "=== Step 2: Run Ansible Playbook ==="
    export LANG=C.UTF-8
    export LC_ALL=C.UTF-8
    source venv/bin/activate

    ansible-playbook -i localhost, \
      -e requestId=${{ parameters.requestId }} \
      -e env=${{ parameters.env }} \
      -e templateName=${{ parameters.templateName }} \
      -e callbackUrl=${{ parameters.callbackUrl }} \
      azure_poc_playbook.yml
  displayName: Run Ansible Playbook for Azure

- script: |
    echo "=== Step 3: Send Callback to ServiceNow ==="
    source venv/bin/activate

    python3 callback.py
  displayName: Send Status Callback to ServiceNow
